name: ci

# B-01 决策：Ubuntu 验收证据**只**来自 GitHub Actions 的 ubuntu-24.04 runner。
# 本地 Windows/MSYS2 的编译结果不作为验收依据（协作规则 14）。
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: backend/build
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build-and-test:
    name: ubuntu-24.04 / gcc-13 / c++20
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 GCC 13 与 CMake（3.28+）
        run: |
          sudo apt-get update -qq
          # nlohmann-json3-dev：tnycl/api_response.h 的编译依赖（缺失会让首个
          # include 它的 TU 报 "nlohmann/json.hpp: No such file or directory"）
          # libargon2-dev：T-3.02 密码哈希的生产原语。缺它时源码会走 stub 分支
          # （编译通过但 hash 运行即抛），属于"CI 绿、生产崩"，必须装上。
          # libmysqlclient-dev：T-2.04 的 adapters/mysql_conn.cpp 需要 <mysql.h> 与
          # libmysqlclient。验收构建（BUILD_WITH_STRICT_TOOLCHAIN=ON）缺它会直接
          # FATAL_ERROR —— 这是刻意的：不允许"编不过就跳过 MySQL 适配层"。
          sudo apt-get install -y -qq g++-13 gcc-13 cmake ninja-build \
            nlohmann-json3-dev libargon2-dev libmysqlclient-dev pkg-config
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      - name: 打印并校验工具链版本（不通过即失败）
        run: |
          set -euo pipefail
          echo "=== uname ==="; uname -a
          echo "=== gcc ==="; gcc --version | head -1
          echo "=== g++ ==="; g++ --version | head -1
          echo "=== cmake ==="; cmake --version | head -1

          gcc_major=$(gcc -dumpversion | cut -d. -f1)
          cxx_major=$(g++ -dumpversion | cut -d. -f1)
          cmake_ver=$(cmake --version | head -1 | awk '{print $3}')

          [ "$gcc_major" -ge 13 ] || { echo "::error::GCC 需 >= 13，实际 $gcc_major"; exit 1; }
          [ "$cxx_major" -ge 13 ] || { echo "::error::G++ 需 >= 13，实际 $cxx_major"; exit 1; }
          if [ "$(printf '%s\n3.28\n' "$cmake_ver" | sort -V | head -1)" != "3.28" ]; then
            echo "::error::CMake 需 >= 3.28，实际 $cmake_ver"; exit 1
          fi
          echo "toolchain OK"

      # 逐脚本执行，并把失败原因写进 ::error 注释（注释无需登录即可读，
      # 日志需要登录；这个区别决定了能否远程定位 Ubuntu-only 失败）。
      - name: 环境诊断（只打印，不判定）
        working-directory: backend
        run: |
          set +e   # GitHub 的 run 默认 bash -e，诊断步不需要它
          echo "pwd=$(pwd)"
          echo "bash=$BASH_VERSION"
          echo "grep=$(grep --version | head -1)"
          echo "files=$(find src include -type f 2>/dev/null | wc -l)"
          echo "checks=$(ls -1 tools/checks/check_*.sh | wc -l)"

      - name: 静态检查有效性自检（证明六项检查不是假门禁）
        working-directory: backend
        run: |
          # 注意：GitHub 的 run 默认是 bash -e。`out=$(cmd); rc=$?` 在 cmd 非零时
          # 会**当场终止脚本**，导致下面产不出 ::error 注释（v1 就踩了这个坑）。
          # 必须写成 `|| rc=$?` 形式。
          set +e   # 必须关掉 -e：否则任一项非零会当场终止，产不出 ::error
          fail=0
          for c in tools/checks/check_*.sh; do
            rc=0
            out=$(bash "$c" --self-test 2>&1) || rc=$?
            echo "--- $c rc=$rc"; printf '%s\n' "$out"
            hit=no
            if printf '%s' "$out" | grep -q 'SELFTEST PASS'; then hit=yes; fi
            if [ "$rc" -ne 0 ] || [ "$hit" = no ]; then
              msg=$(printf '%s' "$out" | grep -E 'SELFTEST|FAIL' | head -2 | tr '\n' ' ')
              echo "::error file=$c,title=self-test-failed::rc=$rc $msg"
              fail=1
            fi
          done
          exit $fail

      - name: 六项静态检查（T-1.03）
        working-directory: backend
        run: |
          set +e   # 同上
          fail=0
          for c in tools/checks/check_*.sh; do
            rc=0
            out=$(bash "$c" 2>&1) || rc=$?
            echo "--- $c rc=$rc"; printf '%s\n' "$out"
            if [ "$rc" -ne 0 ]; then
              msg=$(printf '%s' "$out" | grep -E 'FAIL|No such|Permission|command not found' | head -3 | tr '\n' ' ')
              echo "::error file=$c,title=static-check-failed::rc=$rc $msg"
              fail=1
            fi
          done
          exit $fail

      # 配置/编译同样把失败原因转成 ::error 注释：
      # 编译器错误默认只进日志，而日志需登录才能读，无法远程定位。
      - name: 配置
        run: |
          set +e
          out=$(cmake -S backend -B "$BUILD_DIR" -G Ninja \
                  -DCMAKE_BUILD_TYPE=Debug \
                  -DCMAKE_C_COMPILER=gcc-13 \
                  -DCMAKE_CXX_COMPILER=g++-13 \
                  -DBUILD_WITH_STRICT_TOOLCHAIN=ON \
                  -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1) || rc=$?
          rc=${rc:-0}
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out" | grep -E "CMake Error|error:" | head -3 | \
              while IFS= read -r l; do echo "::error title=cmake-configure::${l}"; done
          fi
          exit "$rc"

      - name: 编译（告警即错误）
        run: |
          set +e
          out=$(cmake --build "$BUILD_DIR" --parallel 2>&1) || rc=$?
          rc=${rc:-0}
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out" | grep -E "error:|Error [0-9]+$" | head -5 | \
              while IFS= read -r l; do echo "::error title=compile::$(printf '%s' "$l" | cut -c1-300)"; done
          fi
          exit "$rc"

      - name: 测试
        run: |
          set +e
          out=$(ctest --test-dir "$BUILD_DIR" --output-on-failure \
                   --output-junit ctest-report.xml 2>&1) || rc=$?
          rc=${rc:-0}
          printf '%s\n' "$out"
          # 无论成败都把测试汇总发成注释：成功时 annotation 是唯一能
          # 免登录读到的「到底跑了几个测试」的证据，避免只凭状态色推断。
          summary=$(printf '%s\n' "$out" | grep -E "tests passed|tests failed|tests did not run|Skipped" | tr '\n' ' ')
          if [ "$rc" -ne 0 ]; then
            echo "::error title=ctest::${summary:-rc=$rc}"
            printf '%s\n' "$out" | grep -E "Failed|FAILED" | head -5 | \
              while IFS= read -r l; do echo "::error title=ctest-case::${l}"; done
          else
            echo "::notice title=ctest-passed::${summary:-all passed}"
          fi
          exit "$rc"

      - name: 保存构建与测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            backend/build/ctest-report.xml
            backend/build/compile_commands.json
            backend/build/Testing/**
            backend/build/*.log

  # ==========================================================================
  # 集成测试（真实 MySQL 8）—— E4 证据的**唯一**来源
  #
  # 与 build-and-test 的职责分工（刻意不合并）：
  #   - build-and-test：无数据库，编译 + 单测门禁；集成用例无 TNYCL_MYSQL_HOST，
  #                     以 77 退出并显示 Skipped —— 那是"没跑"，不是"通过"。
  #   - 本 job        ：空库 → V001 → V002×3（幂等/不误伤）→ 冲突负向
  #                     → 11 个真实场景 → 清理与隔离断言，且 **77 视为失败**。
  # 合并会掩盖关键区别："编译过了但库没起来" 与 "代码错了" 必须一眼可分。
  #
  # 数据库：独立库 tnycl_it_ci，不复用任何既有库，也不设 MYSQL_DATABASE
  # （避免镜像顺手建库导致"空库"前提不成立）。
  # ==========================================================================
  mysql-integration:
    name: integration / mysql-8.0（真实库 E4）
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: tnycl_ci_root
          # 显式创建 root@'%'：runner 经 docker 端口映射连入，源地址不是 localhost。
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptnycl_ci_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      # Redis 7 仅"备好容器"，**不构成**真实 Redis 集成证据：
      # A 的真实客户端尚未接入，FakeRedis 测试不得冒充 Redis 验收。
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      BUILD_DIR: backend/build
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      TNYCL_MYSQL_HOST: 127.0.0.1
      TNYCL_MYSQL_PORT: '3306'
      TNYCL_MYSQL_USER: root
      TNYCL_MYSQL_PASSWORD: tnycl_ci_root
      TNYCL_MYSQL_DB: tnycl_it_ci
      TNYCL_MYSQL_POOL_SIZE: '4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装工具链与 MySQL 客户端
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-13 gcc-13 cmake ninja-build \
            nlohmann-json3-dev libargon2-dev libmysqlclient-dev pkg-config redis-tools
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get install -y -qq mysql-client
          fi
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          echo "=== gcc ==="; gcc --version | head -1
          echo "=== cmake ==="; cmake --version | head -1
          echo "=== mysql client ==="; mysql --version
          # 只做信息输出：即使没有 .pc，CMakeLists 还有 find_path/find_library 兜底。
          echo "=== mysqlclient pc ==="; pkg-config --modversion mysqlclient || echo "(无 .pc，走 find_path 兜底)"

      - name: 校验服务端可达并打印真实版本（连接证据）
        run: |
          set -euo pipefail
          mysql -h"$TNYCL_MYSQL_HOST" -P"$TNYCL_MYSQL_PORT" -u"$TNYCL_MYSQL_USER" \
                -p"$TNYCL_MYSQL_PASSWORD" -N -B -e \
                "SELECT VERSION(), @@version_comment, @@character_set_server, @@collation_server;"
          version=$(mysql -h"$TNYCL_MYSQL_HOST" -P"$TNYCL_MYSQL_PORT" -u"$TNYCL_MYSQL_USER" \
                    -p"$TNYCL_MYSQL_PASSWORD" -N -B -e "SELECT VERSION();")
          case "$version" in
            8.*) echo "::notice title=mysql-server::真实服务端 MySQL $version（$TNYCL_MYSQL_HOST:$TNYCL_MYSQL_PORT）" ;;
            *) echo "::error title=mysql-version::要求 MySQL 8.x，实际 $version"; exit 1 ;;
          esac

      - name: 配置（与主门禁同一套严格参数）
        run: |
          set +e
          out=$(cmake -S backend -B "$BUILD_DIR" -G Ninja \
                  -DCMAKE_BUILD_TYPE=Debug \
                  -DCMAKE_C_COMPILER=gcc-13 \
                  -DCMAKE_CXX_COMPILER=g++-13 \
                  -DBUILD_WITH_STRICT_TOOLCHAIN=ON \
                  -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1) || rc=$?
          rc=${rc:-0}
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out" | grep -E "CMake Error|error:" | head -3 | \
              while IFS= read -r l; do echo "::error title=cmake-configure::${l}"; done
          fi
          exit "$rc"

      - name: 编译
        run: |
          set +e
          out=$(cmake --build "$BUILD_DIR" --parallel 2>&1) || rc=$?
          rc=${rc:-0}
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out" | grep -E "error:|Error [0-9]+$" | head -5 | \
              while IFS= read -r l; do echo "::error title=compile::$(printf '%s' "$l" | cut -c1-300)"; done
          fi
          exit "$rc"

      - name: 真实库端到端集成（建库 → V001 → V002×3 → 冲突 → 全部场景 → 清理）
        run: bash backend/tools/ci/mysql_e2e.sh

      # 反向对照：证明这套测试**真的在连库**，不是"永远绿的空转"。
      # 连一个不存在的库必须失败；用错密码必须失败。若这两条也"通过"，
      # 说明测试根本没建立连接，前面的绿是假的。
      - name: 反向对照（连错库/错密码必须失败）
        run: |
          set -uo pipefail
          exe=""
          for c in "$BUILD_DIR/mysql_integration_test" "$BUILD_DIR/tests/mysql_integration_test"; do
            if [ -x "$c" ]; then exe="$c"; break; fi
          done
          [ -n "$exe" ] || { echo "::error title=no-test-exe::未找到 mysql_integration_test"; exit 1; }

          neg() {  # $1=说明 $2=DB 名 $3=密码
            local log="/tmp/neg_$1.log"
            local rc=0
            if TNYCL_MYSQL_DB="$2" TNYCL_MYSQL_PASSWORD="$3" "$exe" >"$log" 2>&1; then
              rc=0
            else
              rc=$?
            fi
            echo "--- 反向对照[$1] rc=$rc"
            cat "$log"
            if [ "$rc" -eq 0 ]; then
              echo "::error title=negative-control::$1 竟然成功——测试没有真正连库，前面的通过不可信"
              return 1
            fi
            if grep -q '^\[PASS\]' "$log"; then
              echo "::error title=negative-control::$1 产出了 PASS 行，说明用例没有依赖真实连接"
              return 1
            fi
            echo "[PASS] 反向对照[$1] 按预期失败（rc=$rc），证明测试确实连接了真实 MySQL"
            return 0
          }

          neg wrong-db "definitely_not_exists_db" "$TNYCL_MYSQL_PASSWORD" || exit 1
          neg wrong-password "$TNYCL_MYSQL_DB" "definitely_wrong_password" || exit 1

      - name: Redis 7 容器仅作就绪声明（不作为 Redis 集成验收）
        run: |
          set +e
          out=$(redis-cli -h 127.0.0.1 -p 6379 ping 2>&1)
          echo "redis-cli ping -> $out"
          if [ "$out" = "PONG" ]; then
            echo "::notice title=redis-container-ready::Redis 7 容器可达（PONG）。真实 Redis 客户端尚未接入，本 job 不构成 Redis 集成验收；等 A 交付后另加 Redis 集成 job。"
          else
            echo "::warning title=redis-container::Redis 7 容器不可达（$out）。本 job 不依赖 Redis，不影响 E4 结论。"
          fi
          exit 0

      - name: 保存集成日志与测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-integration-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ci-logs/**
            backend/build/compile_commands.json
